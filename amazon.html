<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amazon-demo</title>
  <link rel="stylesheet" href="styles/amazon.css">
</head>
<body>
  <header class="amazon-header">
    <a href="amazon.html" class="amazon-logo" target="_blank">
      <img src="images/amazon-logo-white.png" alt="amazon-logo">
    </a>

    <div class="amazon-search-bar">
      <input type="text" class="amazon-search-box" placeholder="Search Products">
      <button class="amazon-search-btn">
        <img src="images/icons/search-icon.png" alt="">
      </button>
    </div>

    <div class="mobile-search-bar-icon">
      <img src="images/icons/search-icon.png" alt="search icon">
    </div>

    <a href="tracking.html" class="amazon-return-order" target="_blank">
      <p>return</p>
      <p>& orders</p>
    </a>

    <a href="checkout.html" class="amazon-cart" target="_blank">
      <img src="images/icons/cart-icon.png" alt="cart-icon">
      <div class="cart-title">Cart</div>
      <div class="cart-item">0</div>
    </a>
  </header>

  <main>
    <div class="products">
    </div>
  </main>

  <script src="scripts/amazon.js" type="module"></script>
</body>
</html>
